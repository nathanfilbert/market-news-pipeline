[project]
name = "market-news-pipeline"
version = "0.1.0"
description = "Collects, classifies, stores, and outputs market news event data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
mnp = "mnp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mnp"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["db: requires the Postgres database from docker compose"]
