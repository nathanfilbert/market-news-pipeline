# Assets for article tagging (docs/v1-plan.md §6).
#
# Crypto: top ~100 by market cap from CoinGecko's ranking on 2026-09-27 (names and symbols
# only), minus tokenized funds and wrapped/staked derivatives, plus major stablecoins.
# Review periodically; rankings drift.
#
# Matching (mnp.classify.assets):
#   symbol   always case-sensitive, whole word; "$SYMBOL" cashtags also count
#   aliases  case-insensitive, whole words ("bitcoin", "Bitcoin")
#   exact    case-sensitive aliases, for names that are also ordinary words ("Avalanche")
#   ambiguous: true  the symbol is a common word/abbreviation (LINK, NEAR, SPX): the symbol
#            alone never makes the asset a candidate; an alias, exact alias, cashtag or a
#            source-supplied tag is required.

