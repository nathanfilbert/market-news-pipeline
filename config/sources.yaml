# News sources (docs/v1-plan.md §4). Each URL was fetched and parsed successfully on
# 2026-09-27 before being added. reputation (0-1) is our prior, used downstream.
#
# category: crypto | official | markets | exchange | world

# --- Crypto ---
- name: coindesk
  kind: rss
  url: https://www.coindesk.com/arc/outboundfeeds/rss
  poll_seconds: 60
  category: crypto
  reputation: 0.85

- name: cointelegraph
  kind: rss
  url: https://cointelegraph.com/rss
  poll_seconds: 60
  category: crypto
  reputation: 0.7

- name: theblock
  kind: rss
  url: https://www.theblock.co/rss.xml
  poll_seconds: 60
  category: crypto
  reputation: 0.85
  # WordPress feed paging (?paged=2, 3, ...): `mnp catch-up` can reach ~2 weeks back.
  options: {page_param: paged, max_pages: 10}

- name: decrypt
  kind: rss
  url: https://decrypt.co/feed
  poll_seconds: 90
  category: crypto
  reputation: 0.75

# --- Official / macro ---
- name: fed_press
  kind: rss
  url: https://www.federalreserve.gov/feeds/press_all.xml
  poll_seconds: 120
  category: official
  reputation: 1.0

- name: sec_press
  kind: rss
  url: https://www.sec.gov/news/pressreleases.rss
  poll_seconds: 120
  category: official
  reputation: 1.0

# BLS returns 403 to automated clients without contact details in the User-Agent.
# Set CONTACT_EMAIL in .env, confirm the feed loads, then enable.
- name: bls_latest
  kind: rss
  url: https://www.bls.gov/feed/bls_latest.rss
  poll_seconds: 300
  category: official
  reputation: 1.0
  enabled: false

# --- General markets ---
# Usage terms not yet reviewed: check CNBC's Terms of Service before relying on this feed.
- name: cnbc_markets
  kind: rss
  url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258
  poll_seconds: 120
  category: markets
  reputation: 0.8

# --- Exchange announcements (v1.4, docs/exchange-announcements.md) ---
# Kraken's Global Terms ban bots on its content without written consent; the owner accepted
# polling these published feeds at a polite rate for personal use (2026-09-28).
# Not yet fetched from the pipeline machine: run `mnp check` / watch the first polls.
- name: kraken_listings
  kind: rss
  url: https://blog.kraken.com/category/product/asset-listings/feed
  poll_seconds: 60
  category: exchange
  reputation: 1.0

- name: kraken_status
  kind: rss
  url: https://status.kraken.com/history.rss
  poll_seconds: 120
  category: exchange
  reputation: 1.0

# --- Aggregator ---
# Finnhub market news (news only, no price data): https://finnhub.io/docs/api/market-news.
# The free plan is for personal use only and forbids redistributing the data. Skipped unless
# FINNHUB_API_KEY is set.
#
# Disabled: on 2026-09-27 the crypto category was ~99% CoinDesk + Cointelegraph (already
# collected via RSS), lagged RSS by hours, and CoinDesk items had empty summaries.
- name: finnhub_crypto
  kind: finnhub
  url: https://finnhub.io/api/v1/news
  poll_seconds: 60
  category: crypto
  reputation: 0.6
  options: {category: crypto}
  enabled: false

# The general category is mostly Reuters (not available as RSS), plus Bloomberg and CNBC.
# Reuters links go through news.google.com, so they merge with other sources by headline
# clustering rather than by URL.

- name: finnhub_general
  kind: finnhub
  url: https://finnhub.io/api/v1/news
  poll_seconds: 60
  category: markets
  reputation: 0.6
  options: {category: general}

# --- GDELT (v1.5) ---
# GDELT DOC 2.0 article search: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
# Free, no key, one request per 5 seconds: all GDELT sources share one pacer (a request every
# 10 s, pausing 2 min if throttled). Titles and URLs only, from outlets worldwide; queries use
# GDELT's GKG themes (https://blog.gdeltproject.org/gdelt-global-knowledge-graph/) and are
# limited to English-language coverage.
#
# Disabled until GDELT's terms of use and attribution requirements are checked (plan §12) and
# each query's volume has been looked at: try one with
#   mnp collect --source gdelt_sanctions --once
- name: gdelt_sanctions
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 300
  category: world
  reputation: 0.5
  options: {query: "theme:SANCTIONS sourcelang:english"}
  enabled: false

- name: gdelt_conflict
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 300
  category: world
  reputation: 0.5
  options: {query: "theme:ARMEDCONFLICT sourcelang:english"}
  enabled: false

- name: gdelt_regulation
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 300
  category: world
  reputation: 0.5
  options:
    query: "(theme:EPU_CATS_REGULATION OR theme:EPU_CATS_FINANCIAL_REGULATION) sourcelang:english"
  enabled: false

- name: gdelt_central_banks
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 300
  category: world
  reputation: 0.5
  options:
    query: "(theme:ECON_CENTRALBANK OR theme:EPU_CATS_MONETARY_POLICY) sourcelang:english"
  enabled: false
