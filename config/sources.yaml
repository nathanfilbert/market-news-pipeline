# --- Exchange announcements (v1.4, docs/exchange-announcements.md) ---
# Kraken's Global Terms ban bots on its content without written consent; the owner accepted
# polling these published feeds at a polite rate for personal use (2026-09-28).
# Not yet fetched from the pipeline machine: run `mnp check` / watch the first polls.
- name: kraken_listings
  kind: rss
  url: https://blog.kraken.com/category/product/asset-listings/feed
  poll_seconds: 60
  category: exchange
  reputation: 1.0

- name: kraken_status
  kind: rss
  url: https://status.kraken.com/history.rss
  poll_seconds: 120
  category: exchange
  reputation: 1.0

# --- Sentiment (series, not articles: stored in sentiment_readings) ---
# Crypto Fear & Greed Index, market-wide, one value a day at 00:00 UTC, history from 2018-02.
# Free and keyless; no US restriction. Terms: credit Alternative.me next to any display of the
# data (the API and dashboard do). The first poll loads the full history (~3,000 days).
# https://alternative.me/crypto/fear-and-greed-index/
- name: crypto_fear_greed
  kind: fear_greed
  url: https://api.alternative.me/fng/
  poll_seconds: 3600
  category: sentiment
  reputation: 0.8

# --- Aggregator ---
# Finnhub market news (news only, no price data): https://finnhub.io/docs/api/market-news.
# The free plan is for personal use only and forbids redistributing the data. Skipped unless
# FINNHUB_API_KEY is set.
#
# Disabled: on 2026-09-27 the crypto category was ~99% CoinDesk + Cointelegraph (already
# collected via RSS), lagged RSS by hours, and CoinDesk items had empty summaries.
- name: finnhub_crypto
  kind: finnhub
  url: https://finnhub.io/api/v1/news
  poll_seconds: 60
  category: crypto
  reputation: 0.6
  options: {category: crypto}
  enabled: false

# The general category is mostly Reuters (not available as RSS), plus Bloomberg and CNBC.
# Reuters links go through news.google.com, so they merge with other sources by headline
# clustering rather than by URL.

- name: finnhub_general
  kind: finnhub
  url: https://finnhub.io/api/v1/news
  poll_seconds: 60
  category: markets
  reputation: 0.6
  options: {category: general}
