# --- Aggregator ---
# Finnhub market news (news only, no price data): https://finnhub.io/docs/api/market-news.
# The free plan is for personal use only and forbids redistributing the data. Skipped unless
# FINNHUB_API_KEY is set.
#
# Disabled: on 2026-09-27 the crypto category was ~99% CoinDesk + Cointelegraph (already
# collected via RSS), lagged RSS by hours, and CoinDesk items had empty summaries.
- name: finnhub_crypto
  kind: finnhub
  url: https://finnhub.io/api/v1/news
  poll_seconds: 60
  category: crypto
  reputation: 0.6
  options: {category: crypto}
  enabled: false

# The general category is mostly Reuters (not available as RSS), plus Bloomberg and CNBC.
# Reuters links go through news.google.com, so they merge with other sources by headline
# clustering rather than by URL.

- name: finnhub_general
  kind: finnhub
  url: https://finnhub.io/api/v1/news
  poll_seconds: 60
  category: markets
  reputation: 0.6
  options: {category: general}

# --- GDELT (v1.5) ---
# GDELT DOC 2.0 article search: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
# Free, no key, one request per 5 seconds: all GDELT sources share one pacer (a request every
# 10 s, pausing 5 min if throttled). Titles and URLs only, from outlets worldwide; queries use
# GDELT's GKG themes (https://blog.gdeltproject.org/gdelt-global-knowledge-graph/) and are
# limited to English-language coverage.
#
# Terms (checked 2026-09-28): free for any use, but any use or redistribution must cite the
# GDELT Project and link to https://www.gdeltproject.org/ (see README).
# Each topic query must also carry one specific market theme (a pairing per source): GDELT's
# theme tags are loose, and "topic AND any of several market themes" let through travel lists,
# campus politics and law-firm spam in live testing (2026-09-28). GDELT rejects long queries
# ("too short or too long"), so keep each short. On top of the query, the collector keeps only
# articles whose title mentions a market keyword (DEFAULT_TITLE_KEYWORDS in collectors/gdelt.py;
# override with options.title_keywords).
# Polled every 15 minutes: GDELT publishes in 15-minute batches, and it throttled the owner's IP
# heavily in testing, so polling more often only adds failed requests (nothing is lost; the next
# poll re-reads from the checkpoint).
# Disabled until the owner switches them on; try one with
#   mnp collect --source gdelt_conflict_oil --once

- name: gdelt_conflict_oil
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 900
  category: world
  reputation: 0.5
  options:
    query: theme:ARMEDCONFLICT theme:ECON_OILPRICE sourcelang:english -domain:iheart.com
  enabled: false

- name: gdelt_conflict_stocks
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 900
  category: world
  reputation: 0.5
  options:
    query: theme:ARMEDCONFLICT theme:ECON_STOCKMARKET sourcelang:english -domain:iheart.com
  enabled: false

- name: gdelt_sanctions_oil
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 900
  category: world
  reputation: 0.5
  options:
    query: theme:SANCTIONS theme:ECON_OILPRICE sourcelang:english -domain:iheart.com
  enabled: false

- name: gdelt_sanctions_fx
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 900
  category: world
  reputation: 0.5
  options:
    query: >-
      theme:SANCTIONS theme:ECON_CURRENCY_EXCHANGE_RATE sourcelang:english -domain:iheart.com
  enabled: false

# ~17/h before the title filter: SEC rules, tariff and sanctions laws, analyst calls.
- name: gdelt_regulation
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 900
  category: world
  reputation: 0.5
  options:
    query: >-
      theme:EPU_CATS_FINANCIAL_REGULATION (theme:ECON_STOCKMARKET OR theme:ECON_BANKRUPTCY OR
      theme:ECON_DEBT) sourcelang:english -domain:pr-inside.com -domain:aol.com
  enabled: false

- name: gdelt_central_banks
  kind: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poll_seconds: 900
  category: world
  reputation: 0.5
  options:
    query: >-
      (theme:ECON_CENTRALBANK OR theme:EPU_CATS_MONETARY_POLICY) theme:ECON_INTEREST_RATES
      sourcelang:english -domain:aol.com
  enabled: false
