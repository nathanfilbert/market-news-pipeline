- name: coindesk
  kind: rss
  url: https://www.coindesk.com/arc/outboundfeeds/rss
  poll_seconds: 60
  category: crypto
  reputation: 0.85

- name: cointelegraph
  kind: rss
  url: https://cointelegraph.com/rss
  poll_seconds: 60
  category: crypto
  reputation: 0.7

- name: theblock
