# News sources (docs/v1-plan.md §4). Each URL was fetched and parsed successfully on
# 2026-09-27 before being added. reputation (0-1) is our prior, used downstream.
#
# category: crypto | official | markets | exchange | sentiment

# --- Crypto ---
- name: coindesk
  kind: rss
  url: https://www.coindesk.com/arc/outboundfeeds/rss
  poll_seconds: 60
  category: crypto
  reputation: 0.85

- name: cointelegraph
  kind: rss
  url: https://cointelegraph.com/rss
  poll_seconds: 60
  category: crypto
  reputation: 0.7

- name: theblock
  kind: rss
  url: https://www.theblock.co/rss.xml
  poll_seconds: 60
  category: crypto
  reputation: 0.85
  # WordPress feed paging (?paged=2, 3, ...): `mnp catch-up` can reach ~2 weeks back.
  options: {page_param: paged, max_pages: 10}

- name: decrypt
  kind: rss
  url: https://decrypt.co/feed
  poll_seconds: 90
  category: crypto
  reputation: 0.75

# PANews English Newsflash (short breaking items; https://www.panewslab.com/en/rss generator,
# type=NEWS). Fetched and parsed on 2026-10-02: 100 items covering about 24h. About 1 in 10
# items is in Chinese despite lang=en and is stored as 'en'. Terms (/en/user-agreement §2.4):
# non-commercial reuse only, crediting the author, linking the original and stating
# "Source: PANews"; commercial use or modification needs PANews's permission.
- name: panews
  kind: rss
  url: https://www.panewslab.com/rss.xml?lang=en&type=NEWS
  poll_seconds: 60
  category: crypto
  reputation: 0.65

# --- Official / macro ---
- name: fed_press
  kind: rss
  url: https://www.federalreserve.gov/feeds/press_all.xml
  poll_seconds: 120
  category: official
  reputation: 1.0

- name: sec_press
  kind: rss
