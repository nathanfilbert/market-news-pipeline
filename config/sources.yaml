# BLS returns 403 to automated clients without contact details in the User-Agent.
# Set CONTACT_EMAIL in .env, confirm the feed loads, then enable.
- name: bls_latest
  kind: rss
  url: https://www.bls.gov/feed/bls_latest.rss
  poll_seconds: 300
  category: official
  reputation: 1.0
  enabled: false

