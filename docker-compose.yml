services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mnp
      POSTGRES_PASSWORD: mnp
      POSTGRES_DB: mnp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnp -d mnp"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
